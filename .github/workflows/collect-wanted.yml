name: 必要になった資料と判決の目次を更新

# collectors/fetch.py で「必要になって取り込んだ資料」は config/wanted.json に記録される。
# ここで毎週取り直し、改正・差替えを反映する。**一度取りに行ったものは、以後ずっと最新に保たれる。**
# あわせて税務訴訟資料（判決）の目次を更新する。
on:
  schedule:
    - cron: '0 19 * * 6'        # 毎週日曜 JST 04:00
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/wanted.json'
      - 'collectors/fetch.py'
      - 'collectors/nta_sosho.py'
      - '.github/workflows/collect-wanted.yml'

concurrency:
  group: collect-wanted
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PDF を読む部品
        run: pip install pypdf
      - name: 取得
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python collectors/nta_sosho.py
          python collectors/fetch.py wanted
          python collectors/catalog.py
      - name: 差分があれば commit して push
        run: |
          set -euo pipefail
          git config user.name  "wanted-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "変更はありませんでした。"; exit 0
          fi
          git add -A
          git commit -m "必要資料・判決目次を更新: $(date -u -d '+9 hours' +%Y-%m-%d)" \
            -m "出典: 国税庁・税務大学校（税務訴訟資料）ほか config/wanted.json に記載のもの"
          git push
